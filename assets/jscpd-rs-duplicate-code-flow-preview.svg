<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">jscpd-rs duplicate-code detection flow</title>
  <desc id="desc">A preview-safe diagram showing source files flowing into the native jscpd-rs scanner and producing duplicate-code feedback for CI, reviewers, and AI coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#0f5fff"/>
      <stop offset="1" stop-color="#00a884"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#233f5f"/>
    </marker>
    <style>
      .title { fill: #10141c; font: 850 44px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { fill: #5f6673; font: 700 21px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #10141c; font: 850 25px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #566173; font: 700 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #273244; font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .tiny { fill: #708096; font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke: #dfe6f1; stroke-width: 2; }
      .arrow { fill: none; stroke: #233f5f; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1050" cy="112" r="112" fill="#e9f6f3"/>
  <circle cx="165" cy="765" r="150" fill="#edf4ff"/>

  <text x="600" y="92" text-anchor="middle" class="title">Fast duplicate-code detection</text>
  <text x="600" y="130" text-anchor="middle" class="subtitle">Repo scan -> native Rust matcher -> CI, review, and AI-agent feedback</text>

  <g filter="url(#shadow)">
    <rect x="80" y="260" width="270" height="360" rx="22" class="card"/>
    <text x="120" y="318" class="label">Repository</text>
    <text x="120" y="350" class="small">source files and tests</text>

    <rect x="120" y="400" width="185" height="44" rx="10" fill="#f6f8fc" stroke="#dfe6f1"/>
    <circle cx="145" cy="422" r="8" fill="#0f5fff"/>
    <text x="167" y="428" class="mono">payment.ts</text>

    <rect x="140" y="462" width="175" height="44" rx="10" fill="#f6f8fc" stroke="#dfe6f1"/>
    <circle cx="165" cy="484" r="8" fill="#00a884"/>
    <text x="187" y="490" class="mono">invoice.ts</text>

    <rect x="120" y="524" width="195" height="44" rx="10" fill="#f6f8fc" stroke="#dfe6f1"/>
    <circle cx="145" cy="546" r="8" fill="#ffb020"/>
    <text x="167" y="552" class="mono">helpers.js</text>
  </g>

  <path d="M372 440 C402 440 420 440 448 440" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="460" y="232" width="280" height="416" rx="28" class="card"/>
    <rect x="495" y="278" width="210" height="76" rx="20" fill="url(#brand)"/>
    <text x="600" y="324" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="850">jscpd-rs</text>
    <text x="600" y="349" text-anchor="middle" fill="#dff4ff" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="800">native Rust scanner</text>

    <rect x="500" y="404" width="200" height="48" rx="13" fill="#f7f9fd" stroke="#dfe6f1"/>
    <text x="523" y="435" class="mono">tokenize</text>
    <circle cx="654" cy="428" r="8" fill="#0f5fff"/>
    <circle cx="676" cy="428" r="8" fill="#00a884"/>

    <rect x="500" y="474" width="200" height="48" rx="13" fill="#f7f9fd" stroke="#dfe6f1"/>
    <text x="523" y="505" class="mono">fingerprint</text>
    <path d="M644 498 h12 m14 0 h12" stroke="#a9b7ca" stroke-width="4" stroke-linecap="round"/>

    <rect x="500" y="544" width="200" height="48" rx="13" fill="#f7f9fd" stroke="#dfe6f1"/>
    <text x="523" y="575" class="mono">match</text>
    <path d="M624 568 h21 m14 0 h21" stroke="#00a884" stroke-width="6" stroke-linecap="round"/>

    <rect x="500" y="604" width="200" height="34" rx="17" fill="#ecfdf5" stroke="#b7ead2"/>
    <text x="600" y="627" text-anchor="middle" fill="#047857" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="850">50x+ speedups</text>
  </g>

  <path d="M752 440 C782 440 800 440 828 440" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="850" y="260" width="270" height="360" rx="22" class="card"/>
    <text x="890" y="318" class="label">Duplicates</text>
    <text x="890" y="350" class="small">actionable feedback</text>

    <rect x="890" y="400" width="190" height="60" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="914" y="425" class="mono">cluster found</text>
    <text x="914" y="447" class="tiny">2 files / 48 lines</text>

    <path d="M914 500 h145" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <path d="M914 530 h112" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
    <path d="M914 562 h145" stroke="#0f5fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M914 592 h112" stroke="#0f5fff" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  </g>

  <g transform="translate(295 735)">
    <rect x="0" y="0" width="155" height="46" rx="23" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="78" y="30" text-anchor="middle" class="small">CI gate</text>
    <rect x="195" y="0" width="180" height="46" rx="23" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="285" y="30" text-anchor="middle" class="small">human review</text>
    <rect x="415" y="0" width="175" height="46" rx="23" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="503" y="30" text-anchor="middle" class="small">AI agents</text>
  </g>
</svg>
