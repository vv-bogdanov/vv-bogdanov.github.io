<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">jscpd-rs fast duplicate-code detection flow</title>
  <desc id="desc">A schematic showing a repository scanned by jscpd-rs, duplicate fragments found, and fast feedback sent to CI, reviewers, and AI coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f8fb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" x2="1">
      <stop offset="0" stop-color="#0f5fff"/>
      <stop offset="1" stop-color="#00a884"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6">
      <path d="M1 1 L11 6 L1 11 Z" fill="#25405f"/>
    </marker>
    <style>
      .title { fill: #10141c; font: 800 54px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { fill: #5f6673; font: 500 25px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #10141c; font: 800 27px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #566173; font: 600 19px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #273244; font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .muted { fill: #748094; font: 600 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke: #dfe6f1; stroke-width: 2; }
      .arrow { fill: none; stroke: #25405f; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #a9b7ca; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="150" r="150" fill="#edf7f4"/>
  <circle cx="250" cy="760" r="190" fill="#eef4ff"/>

  <text x="88" y="96" class="title">Fast duplicate-code detection for large repos</text>
  <text x="90" y="137" class="subtitle">jscpd-rs turns copy-paste detection into a cheap CI and agent feedback loop.</text>

  <g filter="url(#shadow)">
    <rect x="86" y="232" width="360" height="430" rx="22" class="card"/>
    <text x="126" y="288" class="label">Repository</text>
    <text x="126" y="324" class="small">many files, many generated paths</text>

    <g transform="translate(126 374)">
      <rect x="0" y="0" width="245" height="46" rx="10" fill="#f6f8fc" stroke="#dfe6f1"/>
      <circle cx="24" cy="23" r="8" fill="#0f5fff"/>
      <text x="48" y="29" class="mono">src/payment.ts</text>
      <rect x="26" y="64" width="276" height="46" rx="10" fill="#f6f8fc" stroke="#dfe6f1"/>
      <circle cx="50" cy="87" r="8" fill="#00a884"/>
      <text x="74" y="93" class="mono">src/invoice.ts</text>
      <rect x="0" y="128" width="260" height="46" rx="10" fill="#f6f8fc" stroke="#dfe6f1"/>
      <circle cx="24" cy="151" r="8" fill="#ffb020"/>
      <text x="48" y="157" class="mono">tests/helpers.js</text>
      <rect x="40" y="192" width="238" height="46" rx="10" fill="#f6f8fc" stroke="#dfe6f1"/>
      <circle cx="64" cy="215" r="8" fill="#ff5f57"/>
      <text x="88" y="221" class="mono">packages/api.rs</text>
    </g>

    <text x="126" y="632" class="muted">Ignore files, glob filters, formats</text>
  </g>

  <path d="M470 448 C535 448 555 448 620 448" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="628" y="214" width="362" height="468" rx="28" fill="#ffffff" stroke="#dfe6f1" stroke-width="2"/>
    <rect x="668" y="254" width="282" height="86" rx="20" fill="url(#rust)"/>
    <text x="704" y="308" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="850">jscpd-rs</text>
    <text x="706" y="336" fill="#dff4ff" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">native Rust scanner</text>

    <g transform="translate(672 392)">
      <rect x="0" y="0" width="278" height="54" rx="14" fill="#f7f9fd" stroke="#dfe6f1"/>
      <text x="22" y="35" class="mono">tokenize</text>
      <circle cx="224" cy="27" r="9" fill="#0f5fff"/>
      <circle cx="248" cy="27" r="9" fill="#00a884"/>
      <rect x="0" y="76" width="278" height="54" rx="14" fill="#f7f9fd" stroke="#dfe6f1"/>
      <text x="22" y="111" class="mono">fingerprint</text>
      <path d="M214 101 h44" class="thin"/>
      <rect x="0" y="152" width="278" height="54" rx="14" fill="#f7f9fd" stroke="#dfe6f1"/>
      <text x="22" y="187" class="mono">match windows</text>
      <path d="M205 179 h16 m14 0 h16 m14 0 h16" stroke="#00a884" stroke-width="6" stroke-linecap="round"/>
    </g>

    <rect x="672" y="632" width="278" height="34" rx="17" fill="#ecfdf5" stroke="#b7ead2"/>
    <text x="704" y="655" fill="#047857" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="800">50x+ public benchmark speedups</text>
  </g>

  <path d="M1014 448 C1074 448 1094 448 1154 448" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="1164" y="232" width="350" height="430" rx="22" class="card"/>
    <text x="1204" y="288" class="label">Actionable output</text>
    <text x="1204" y="324" class="small">duplicate blocks become feedback</text>

    <g transform="translate(1204 374)">
      <rect x="0" y="0" width="270" height="68" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="24" y="29" class="mono">duplicate cluster</text>
      <text x="24" y="52" class="muted">2 files / 48 lines</text>
      <path d="M32 102 h206" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
      <path d="M32 132 h156" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
      <path d="M32 162 h206" stroke="#0f5fff" stroke-width="8" stroke-linecap="round"/>
      <path d="M32 192 h156" stroke="#0f5fff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    </g>

    <g transform="translate(1204 590)">
      <rect x="0" y="0" width="86" height="40" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="23" y="26" class="small">CI</text>
      <rect x="102" y="0" width="106" height="40" rx="20" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="126" y="26" class="small">review</text>
      <rect x="224" y="0" width="86" height="40" rx="20" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="246" y="26" class="small">agent</text>
    </g>
  </g>

  <path d="M1340 700 C1130 804 560 808 320 688" fill="none" stroke="#718096" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14" marker-end="url(#arrow)"/>
  <text x="620" y="803" class="small">deduplicate, reuse, or keep intentional local duplication</text>
</svg>
